services:
  postgres:
    image: postgres:16-alpine
    container_name: safefam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safefam}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safefam}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safefam-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: safefam-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-safefam}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-safefam-local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safefam-network

  spring-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safefam-spring-server
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-safefam}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-safefam}:${RABBITMQ_PASSWORD:-safefam-local}@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-safefam}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-safefam-local}

      ANALYSIS_PUBLISHER_ENABLED: "${ANALYSIS_PUBLISHER_ENABLED:-true}"
      ANALYSIS_CONSUMER_ENABLED: "${ANALYSIS_CONSUMER_ENABLED:-true}"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-1800000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}

      OUTBOX_ENCRYPTION_KEY_BASE64: ${OUTBOX_ENCRYPTION_KEY_BASE64}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-local-kakao-client}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-local-solapi-key}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-local-solapi-secret}
      SOLAPI_SENDER: ${SOLAPI_SENDER:-01000000000}

      # 로컬 통합 환경에서는 Firebase 초기화 생략
      FIREBASE_SERVICE_ACCOUNT_PATH: test
    ports:
      - "${SPRING_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - safefam-network

  fastapi-ai:
    build:
      context: ../SafeFam_AI
      dockerfile: Dockerfile
    container_name: safefam-ai-server
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-safefam}:${RABBITMQ_PASSWORD:-safefam-local}@rabbitmq:5672/

      RABBITMQ_ANALYSIS_EXCHANGE: safefam.analysis
      RABBITMQ_ANALYSIS_REQUEST_QUEUE: safefam.analysis.requested.q
      RABBITMQ_ANALYSIS_REQUEST_ROUTING_KEY: analysis.requested.v1

      RABBITMQ_ANALYSIS_COMPLETED_ROUTING_KEY: analysis.completed.v1
      RABBITMQ_ANALYSIS_PARTIAL_ROUTING_KEY: analysis.partial.v1
      RABBITMQ_ANALYSIS_FAILED_ROUTING_KEY: analysis.failed.v1

      RABBITMQ_ANALYSIS_DLQ: safefam.analysis.requested.dlq
      RABBITMQ_ANALYSIS_DLQ_ROUTING_KEY: analysis.requested.dead.v1

      RABBITMQ_PREFETCH_COUNT: ${AI_RABBITMQ_PREFETCH_COUNT:-1}
      RABBITMQ_CONSUMER_ENABLED: "${AI_RABBITMQ_CONSUMER_ENABLED:-true}"
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: ${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-5}
      RABBITMQ_SHUTDOWN_TIMEOUT_SECONDS: ${RABBITMQ_SHUTDOWN_TIMEOUT_SECONDS:-30}
      RABBITMQ_REQUEUE_BACKOFF_SECONDS: ${RABBITMQ_REQUEUE_BACKOFF_SECONDS:-1}

      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--root-path",
        "/ai"
      ]
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - safefam-network

  nginx:
    image: nginx:1.27-alpine
    container_name: safefam-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spring-backend:
        condition: service_healthy
      fastapi-ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safefam-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  safefam-network:
    name: safefam-network
    driver: bridge
