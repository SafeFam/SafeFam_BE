name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Spring Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Spring Docker image
        run: docker build -t safefam-backend:test .

  compose-build:
    name: Integrated Compose build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: SafeFam_BE
          persist-credentials: false

      - name: Checkout AI
        uses: actions/checkout@v4
        with:
          repository: SafeFam/SafeFam_AI
          ref: develop
          path: SafeFam_AI
          persist-credentials: false

      - name: Validate Compose configuration
        working-directory: SafeFam_BE
        run: >
          docker compose
          --env-file .env.example
          config

      - name: Build integrated services
        working-directory: SafeFam_BE
        run: >
          docker compose
          --env-file .env.example
          build
          spring-backend
          fastapi-ai