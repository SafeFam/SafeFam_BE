name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Spring Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Spring Docker image
        run: docker build -t safefam-backend:test .

  compose-build:
    name: Integrated Compose build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      RABBITMQ_USERNAME: ci_user
      RABBITMQ_PASSWORD: ci_password
      RABBITMQ_URL: amqp://ci_user:ci_password@rabbitmq:5672/
      JWT_SECRET: ci-only-jwt-secret
      OUTBOX_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FIREBASE_SERVICE_ACCOUNT_HOST_PATH: ./ci-firebase-service-account.json
      GEMINI_API_KEY: ci-only-gemini-key
    needs:
      - test

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: SafeFam_BE
          persist-credentials: false

      - name: Checkout AI
        uses: actions/checkout@v4
        with:
          repository: SafeFam/SafeFam_AI
          ref: develop
          path: SafeFam_AI
          persist-credentials: false

      - name: Validate Compose configuration
        working-directory: SafeFam_BE
        run: >
          docker compose
          --env-file .env.example
          config

      - name: Build integrated services
        working-directory: SafeFam_BE
        run: >
          docker compose
          --env-file .env.example
          build
          spring-backend
          fastapi-ai

  deploy:
    name: Deploy Backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - test
      - docker-build
      - compose-build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-cd.yml
