spring:
  application:
    name: safefam

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safefam}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000} # 만료 시간 30분
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 만료일 7일

phone-verification:
  expiration: ${PHONE_VERIFICATION_EXPIRATION:180000}
  resend-cooldown: ${PHONE_VERIFICATION_RESEND_COOLDOWN:60000}
  max-attempts: ${PHONE_VERIFICATION_MAX_ATTEMPTS:5}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  user-info-url: https://kapi.kakao.com/v2/user/me

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender: ${SOLAPI_SENDER}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}
