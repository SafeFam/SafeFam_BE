spring:
  application:
    name: safefam

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safefam}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://safefam:safefam-local@localhost:5672}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:safefam}
    password: ${RABBITMQ_PASSWORD:safefam-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000} # 만료 시간 30분
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 만료일 7일

phone-verification:
  expiration: ${PHONE_VERIFICATION_EXPIRATION:180000}
  resend-cooldown: ${PHONE_VERIFICATION_RESEND_COOLDOWN:60000}
  max-attempts: ${PHONE_VERIFICATION_MAX_ATTEMPTS:5}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  user-info-url: https://kapi.kakao.com/v2/user/me

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender: ${SOLAPI_SENDER}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}

safefam:
  messaging:
    analysis:
      exchange: safefam.analysis

      request-queue: safefam.analysis.requested.q
      request-routing-key: analysis.requested.v1

      result-queue: safefam.analysis.result.q
      completed-routing-key: analysis.completed.v1
      partial-routing-key: analysis.partial.v1
      failed-routing-key: analysis.failed.v1

      result-dlq: safefam.analysis.result.dlq
      result-dlq-routing-key: analysis.result.dead.v1
      result-max-deliveries: 2
      result-prefetch: 10

      publisher-enabled: ${ANALYSIS_PUBLISHER_ENABLED:true}
      consumer-enabled: ${ANALYSIS_CONSUMER_ENABLED:true}

      publisher-delay: ${ANALYSIS_PUBLISHER_DELAY:1000}
    outbox:
      encryption-key: ${OUTBOX_ENCRYPTION_KEY_BASE64}
  scheduler:
    time-zone: Asia/Seoul
  # 가족 안전 미확인 재알림 간격과 스케줄러 조회 주기
  family-safety:
    reminder-delay-minutes: ${FAMILY_SAFETY_REMINDER_DELAY_MINUTES:10}
    failure-retry-delay-minutes: ${FAMILY_SAFETY_FAILURE_RETRY_DELAY_MINUTES:1}
    scheduler-delay-ms: ${FAMILY_SAFETY_SCHEDULER_DELAY_MS:60000}
